name: horus

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: horus
      POSTGRES_PASSWORD: horus
      POSTGRES_DB: horus
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
