name: CI

# Frugal by design (public repos run Actions free, but keep it lean anyway):
# ubuntu-only, single Python, narrow triggers, and in-progress runs are cancelled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + dev tools
        run: |
          python -m pip install --upgrade pip
          # torch is the heaviest dep; the CPU wheel index keeps the CI install small.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/horus

      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Typecheck + lint + build
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run lint

  docker:
    # The deploy image has its own dependency graph and bakes the synthetic DB/model.
    # Keep this separate from the fast gates: a container-only breakage should be visible
    # without delaying lint/type feedback.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build deployment image
        run: docker build -f Dockerfile.web -t horus-web:ci .

      - name: Boot and smoke the baked demo
        run: |
          set -euo pipefail
          docker run --rm -d --name horus-smoke -p 8000:8000 \
            -e HORUS_DEMO_MODE=true horus-web:ci
          trap 'docker stop horus-smoke >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/tmp/horus-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs horus-smoke
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/stats |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["demo_mode"] is True and d["aircraft"] > 0'
          curl -fsS http://127.0.0.1:8000/model |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["model_source"] == "trained-artifact" and d["artifact_sha256"]'
          curl -fsS -H 'content-type: application/json' \
            --data '{"points":[{"lat":1.2,"lon":103.6,"alt_ft":36000,"ts":0},{"lat":1.3,"lon":103.6,"alt_ft":36000,"ts":30}]}' \
            http://127.0.0.1:8000/score-track |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["scored"] is True'
